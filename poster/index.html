<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>앞마당 설치 포스터 (A4)</title>
  <meta name="description" content="단지 게시판에 붙이는 앞마당 설치 안내 포스터. A4 세로로 인쇄하세요.">
  <meta name="theme-color" content="#F6F2EA">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/poster.css">
  <script type="module" src="/assets/poster.js"></script>
</head>
<body>
  <header class="top poster-bar">
    <div class="wrap">
      <a class="brand" href="/"><img src="/assets/logo.svg" alt="" width="32" height="32">앞마당</a>
      <button type="button" class="btn btn-forest btn-print" id="print-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7Z"/></svg>
        인쇄
      </button>
    </div>
  </header>

  <main class="poster-stage">
    <article class="sheet" aria-label="앞마당 설치 포스터, A4 세로">
      <header class="p-head">
        <img class="p-logo" src="/assets/logo.svg" alt="앞마당 로고" width="120" height="120">
        <div>
          <h1 class="p-name">앞마당</h1>
          <p class="p-sub">우리 단지 시설 예약·입장</p>
        </div>
      </header>

      <section class="p-qr-wrap" aria-label="앱 받기 QR">
        <div class="p-qr" id="poster-qr" role="img" aria-label="앱 받기 주소 dev-riverkim.github.io/?get=app 의 QR 코드"></div>
        <div class="p-qr-text">
          <p class="p-qr-title">카메라로 찍고 설치</p>
          <p class="p-qr-line">아이폰·안드로이드 모두 카메라로 찍으세요</p>
        </div>
      </section>

      <ol class="p-steps">
        <li>
          <div class="p-art art-cam" role="img" aria-label="폰 카메라 화면 가운데에 QR 코드가 잡힌 그림">
            <span class="cam-frame"><span class="cam-qr" id="poster-mini-qr"></span></span>
          </div>
          <p class="p-step"><span class="p-no">1</span>카메라로 QR</p>
        </li>
        <li>
          <div class="p-art art-get" role="img" aria-label="폰 화면에 APK 받기 버튼과 웹앱 열기 버튼이 있는 그림">
            <span class="get-b brick">APK 받기</span>
            <span class="get-or">아이폰은</span>
            <span class="get-b forest">웹앱 열기</span>
          </div>
          <p class="p-step"><span class="p-no">2</span>받기 / 웹앱 열기</p>
        </li>
        <li>
          <div class="p-art art-join" role="img" aria-label="가입 화면에 인증번호 202610을 넣는 그림">
            <span class="join-label">세대 인증번호</span>
            <span class="join-boxes"><i>2</i><i>0</i><i>2</i><i>6</i><i>1</i><i>0</i></span>
            <span class="join-btn">가입</span>
          </div>
          <p class="p-step"><span class="p-no">3</span>인증번호 넣고 가입</p>
        </li>
      </ol>

      <section class="p-code" aria-label="시연 세대 인증번호 202610">
        <p class="p-code-label">시연 세대 인증번호</p>
        <p class="p-code-num" aria-hidden="true"><span>2</span><span>0</span><span>2</span><span>6</span><span>1</span><span>0</span></p>
      </section>

      <footer class="p-foot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6Z"/><path d="M12 9v4"/><path d="M12 16.5h.01"/></svg>
        <span>설치 전에 꼭 보세요</span>
        <b>dev-riverkim.github.io/install</b>
      </footer>
    </article>
  </main>
</body>
</html>
